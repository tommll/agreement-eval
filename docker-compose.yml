services:
  postgres:
    image: postgres:16-alpine
    container_name: agreement-eval-pg
    environment:
      POSTGRES_USER: agreement
      POSTGRES_PASSWORD: agreement
      POSTGRES_DB: agreement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agreement"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
